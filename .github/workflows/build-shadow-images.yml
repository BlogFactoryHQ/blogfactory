name: Build Cloud images

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/cloud-phase-a-b, codex/hetzner-all-in-one-cloud]
    paths:
      - ".github/workflows/build-shadow-images.yml"
      - "deploy/cloud/**"
      - "server/**"
      - "web/**"
      - "package*.json"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: blogfactory
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blogfactory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blogfactory
      POSTGRES_INTEGRATION_ALLOW_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run test:server
      - run: npm run test:postgres
      - run: npm run typecheck
      - run: npm run test --workspace=web
      - run: npm run build
      - name: Validate deployment scripts
        run: |
          for file in deploy/cloud/postgres/*.sh deploy/cloud/backup/*.sh deploy/cloud/preflight-registry*.sh; do sh -n "$file"; done
          sh deploy/cloud/backup/backup.self-test.sh
          sh deploy/cloud/preflight-registry.self-test.sh
      - name: Validate Compose
        env:
          POSTGRES_IMAGE: postgres:18-alpine
          POSTGRES_OWNER_PASSWORD: ownerpass
          POSTGRES_RUNTIME_PASSWORD: runtimepass
          BLOGFACTORY_API_IMAGE: example/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BLOGFACTORY_WEB_IMAGE: example/web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BLOGFACTORY_BACKUP_IMAGE: example/backup@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          RSS_SCHEDULER_IMAGE: curlimages/curl:8.16.0
          JWT_SECRET: ci-jwt-secret
          API_KEY_ENCRYPTION_SECRET: 01234567890123456789012345678901
          CRON_SECRET: ci-cron-secret
          AUTH_RATE_LIMIT_SECRET: ci-auth-rate-limit-secret
          ADMIN_EMAILS: ci@example.com
          BLOGFACTORY_URL: http://127.0.0.1:8080
          S3_ENDPOINT: https://example.invalid
          S3_ACCESS_KEY_ID: ci-key
          S3_SECRET_ACCESS_KEY: ci-secret
          S3_BUCKET: ci-bucket
          BACKUP_AGE_RECIPIENT: age1ci
          BACKUP_AGE_IDENTITY_FILE: /dev/null
        run: docker compose -f deploy/cloud/compose.yaml config -q
      - name: Test encrypted backup and restore
        run: sh deploy/cloud/backup/integration-test.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: blogfactory-cloud-api
            context: server
            dockerfile: server/Dockerfile
          - image: blogfactory-cloud-web
            context: .
            dockerfile: web/Dockerfile
          - image: blogfactory-cloud-backup
            context: deploy/cloud/backup
            dockerfile: deploy/cloud/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/blogfactoryhq/${{ matrix.image }}:sha-${{ github.sha }}
      - name: Record immutable image
        run: echo '${{ matrix.image }}=ghcr.io/blogfactoryhq/${{ matrix.image }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
