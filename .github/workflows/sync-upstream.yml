name: Sync public core

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-public-core
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Merge and validate public core
        run: |
          git config user.name "blogfactory-cloud-sync[bot]"
          git config user.email "blogfactory-cloud-sync[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/BlogFactoryHQ/blogfactory.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Private Cloud already contains the latest public core."
            exit 0
          fi
          git merge --no-edit upstream/main || {
            test -f .git/MERGE_HEAD
            git rm -f --ignore-unmatch -- .github/workflows/full-cron.yml .github/workflows/rss-cron.yml
            git commit --no-edit
          }
          npm ci
          npm run test:server
          npm run typecheck
          npm run test --workspace=web
          npm run build
          git push origin HEAD:main
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[] | select(.path == ".github/workflows/deploy-cloud.yml") | .id')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
