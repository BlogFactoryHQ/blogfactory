name: Image queue tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: image-queue-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain BlogFactory image queue
        env:
          BLOGFACTORY_CRON_SECRET: ${{ secrets.BLOGFACTORY_CRON_SECRET }}
          BLOGFACTORY_IMAGE_CRON_URL: ${{ vars.BLOGFACTORY_IMAGE_CRON_URL }}
        run: |
          test -n "$BLOGFACTORY_CRON_SECRET"
          CRON_URL="${BLOGFACTORY_IMAGE_CRON_URL:-https://blogfactory.io/api/cron/drain?task=images}"
          curl --fail --show-error --silent --max-time 70 \
            -H "Authorization: Bearer ${BLOGFACTORY_CRON_SECRET}" \
            "$CRON_URL"
