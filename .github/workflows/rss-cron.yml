name: RSS scheduler tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: rss-scheduler-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call BlogFactory RSS scheduler
        env:
          BLOGFACTORY_CRON_SECRET: ${{ secrets.BLOGFACTORY_CRON_SECRET }}
          BLOGFACTORY_CRON_URL: ${{ vars.BLOGFACTORY_CRON_URL }}
        run: |
          test -n "$BLOGFACTORY_CRON_SECRET"
          CRON_URL="${BLOGFACTORY_CRON_URL:-https://blogfactory.io/api/cron/drain?task=feeds}"
          curl --fail --show-error --silent --max-time 70 \
            -H "Authorization: Bearer ${BLOGFACTORY_CRON_SECRET}" \
            "$CRON_URL"
